[project]
name = "complaint-workflow"
version = "0.1.0"
description = "Temporal-based complaint handling workflow with LLM integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.8.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.59.0",  # Azure OpenAI structured outputs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
