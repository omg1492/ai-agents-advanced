# Default values for demo chart
# This is a YAML-formatted file.

replicaCount: 1

# Container registry (set via Terraform)
registry: "rdappsa2tj.azurecr.io"

# Image pull policy
imagePullPolicy: Always

# Image tag (set via Terraform or defaults to latest)
imageTag: latest

# Domain configuration (set via Terraform)
domain: "dreamfarm.tomasdemo.org"

# Resources for all containers
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# MCP API key (set via Terraform)
mcpApiKey: "changeme"

# OpenAI configuration (set via Terraform)
openai:
  apiKey: "changeme"
  baseUrl: ""

# PostgreSQL configuration (Azure Database for PostgreSQL)
postgres:
  host: ""  # Set via Terraform
  port: "5432"
  database: "aidb"
  username: ""  # Set via Terraform
  password: ""  # Set via Terraform (sensitive)
  jdbcUrl: ""  # Set via Terraform (jdbc:postgresql://host:port/database)

# Keycloak configuration
keycloak:
  adminPassword: ""  # Set via Terraform (sensitive)
  hostname: ""  # Set via Terraform (e.g., keycloak.dreamfarm.tomasdemo.org)

# Tavily API configuration
tavily:
  apiKey: ""  # Set via Terraform (sensitive)

# OpenTelemetry configuration
otel:
  # Experiment identifier for A/B testing and trace filtering
  # Default: "default"
  # Examples: "production", "canary", "experiment-v2"
  experiment: "default"
  
  # OpenAI Instrumentation Provider: "opentelemetry" (standard GenAI conventions) or "openinference" (custom conventions)
  # Default: "openinference" (temporary for Responses API streaming support)
  # Use "openinference" temporarily until PR #3396 is merged for Responses API streaming
  # Switch to "opentelemetry" once PR is merged for Langfuse compatibility
  # See: https://github.com/traceloop/openllmetry/pull/3396
  instrumentationProvider: "openinference"

# Langfuse LLM Observability configuration
langfuse:
  # Langfuse OTLP endpoint (internal cluster service)
  # Default points to the Langfuse service deployed via Terraform
  endpoint: "http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/otel"
  
  # Authorization header for Langfuse API authentication
  # Format: "Basic <base64(public_key:secret_key)>"
  # Set via Terraform using the generated API keys
  # Default empty value disables authentication (for testing only)
  authorization: ""

# Chef agent specific configuration
chefAgent:
  mcpUrl: ""  # Set via Terraform to https://mcp-chef-services.domain/mcp

# Dreamfarm agent specific configuration
dreamfarmAgent:
  farmerToolsUrl: ""  # Set via Terraform to https://mcp-public-farmer-tools.domain/mcp
  visualizationUrl: ""  # Set via Terraform to https://mcp-visualization-generator.domain/mcp
  keycloakUrl: ""  # Set via Terraform to https://keycloak.domain

# Frontend configuration
frontend:
  backendUrl: ""  # Set via Terraform to https://dreamfarm-agent.domain
  keycloakUrl: ""  # Set via Terraform to https://keycloak.domain
  redirectUri: ""  # Set via Terraform to https://domain/

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # SSE/Streaming support for MCP servers
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
