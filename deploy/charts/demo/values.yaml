# Default values for demo chart
# This is a YAML-formatted file.

replicaCount: 1

# Container registry (set via Terraform)
registry: "rdappsa2tj.azurecr.io"

# Image pull policy
imagePullPolicy: Always

# Image tag (set via Terraform or defaults to latest)
imageTag: latest

# Resources for all containers
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# MCP API key (set via Terraform)
mcpApiKey: "changeme"

# OpenAI configuration (set via Terraform)
openai:
  apiKey: "changeme"
  baseUrl: ""

# PostgreSQL configuration (Azure Database for PostgreSQL)
postgres:
  host: ""  # Set via Terraform
  port: "5432"
  database: "aidb"
  username: ""  # Set via Terraform
  password: ""  # Set via Terraform (sensitive)
  jdbcUrl: ""  # Set via Terraform (jdbc:postgresql://host:port/database)

# Keycloak configuration
keycloak:
  adminPassword: ""  # Set via Terraform (sensitive)
  hostname: ""  # Set via Terraform (external LoadBalancer IP or DNS)

# Tavily API configuration
tavily:
  apiKey: ""  # Set via Terraform (sensitive)

# Chef agent specific configuration
chefAgent:
  mcpUrl: ""  # Set via Terraform to http://<static-ip>/mcp

# Dreamfarm agent specific configuration
dreamfarmAgent:
  farmerToolsUrl: ""  # Set via Terraform to http://<static-ip>/mcp
  visualizationUrl: ""  # Set via Terraform to http://<static-ip>/mcp
  keycloakUrl: ""  # Set via Terraform to http://<static-ip>

# Frontend configuration
frontend:
  backendUrl: ""  # Set via Terraform to http://<dreamfarm-agent-ip>
  keycloakUrl: ""  # Set via Terraform to http://<keycloak-ip>
  redirectUri: ""  # Set via Terraform to http://<frontend-ip>/

# Static IP configuration for LoadBalancer services
staticIPResourceGroup: ""  # Set via Terraform to main resource group
staticIPNames:
  mcpChefServices: ""  # Set via Terraform
  mcpPublicFarmerTools: ""  # Set via Terraform
  mcpVisualizationGenerator: ""  # Set via Terraform
  dreamfarmAgent: ""  # Set via Terraform
  keycloak: ""  # Set via Terraform
  frontend: ""  # Set via Terraform
