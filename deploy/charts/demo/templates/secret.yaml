{{- if .Values.mcpApiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-credentials
  labels:
    app: demo
type: Opaque
stringData:
  api-key: {{ .Values.mcpApiKey | quote }}
{{- end }}
{{- if .Values.openai.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-credentials
  labels:
    app: demo
type: Opaque
stringData:
  api-key: {{ .Values.openai.apiKey | quote }}
{{- end }}
