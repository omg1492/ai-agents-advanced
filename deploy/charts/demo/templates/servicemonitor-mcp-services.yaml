# ServiceMonitor for MCP Chef Services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcp-chef-services
  labels:
    app: mcp-chef-services
    release: prometheus  # Required for kube-prometheus-stack to discover
spec:
  selector:
    matchLabels:
      app: mcp-chef-services
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
