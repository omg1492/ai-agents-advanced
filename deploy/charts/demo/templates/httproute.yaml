{{- if .Values.gateway.enabled }}
{{- range .Values.services }}
{{- if .external }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  parentRefs:
  - name: {{ $.Values.gateway.name }}
  hostnames:
  - {{ $.Values.gateway.fqdn | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /{{ .name }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: {{ .name }}
      port: 8000
{{- end }}
{{- end }}
{{- end }}
