apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chef-agent
  labels:
    app: chef-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chef-agent
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
