# Ingress for Keycloak
# Runs on keycloak.domain (e.g., keycloak.dreamfarm.tomasdemo.org)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    # Keycloak-specific: preserve hostname
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - keycloak.{{ .Values.domain }}
    secretName: keycloak-tls
  rules:
  - host: keycloak.{{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 80
