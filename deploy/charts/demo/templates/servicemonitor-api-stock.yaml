apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-stock
  labels:
    app: api-stock
    release: prometheus  # Required for kube-prometheus-stack to discover
spec:
  selector:
    matchLabels:
      app: api-stock
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
