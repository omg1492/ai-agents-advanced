apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-chef-services
  labels:
    app: mcp-chef-services
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mcp-chef-services
  template:
    metadata:
      labels:
        app: mcp-chef-services
    spec:
      containers:
      - name: mcp-chef-services
        image: {{ .Values.registry }}/mcp-chef-services:{{ .Values.imageTag | default "latest" }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: MCP_DEFER_DELETE_SECONDS
          value: "60"
        - name: MCP_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcp-credentials
              key: api-key
        - name: MCP_CORS_ORIGINS
          value: "*"
        # OpenTelemetry configuration
        - name: OTEL_SERVICE_NAME
          value: "mcp-chef-services"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_EXPERIMENT
          value: {{ .Values.otel.experiment | default "default" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
