apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  labels:
    app: aspire-dashboard
    app.kubernetes.io/component: aspire-dashboard
spec:
  type: ClusterIP
  ports:
    - port: 18888
      targetPort: http
      protocol: TCP
      name: http
    - port: 18889
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    - port: 18890
      targetPort: otlp-http
      protocol: TCP
      name: otlp-http
  selector:
    app: aspire-dashboard
