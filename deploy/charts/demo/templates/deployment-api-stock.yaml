apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stock
  labels:
    app: api-stock
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-stock
  template:
    metadata:
      labels:
        app: api-stock
    spec:
      containers:
      - name: api-stock
        image: {{ .Values.registry }}/api-stock:{{ .Values.imageTag | default "latest" }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
