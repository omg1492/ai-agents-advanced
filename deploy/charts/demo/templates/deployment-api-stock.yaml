apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stock
  labels:
    app: api-stock
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-stock
  template:
    metadata:
      labels:
        app: api-stock
    spec:
      containers:
      - name: api-stock
        image: {{ .Values.registry }}/api-stock:{{ .Values.imageTag | default "latest" }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        # PostgreSQL Database
        - name: PGHOST
          value: {{ .Values.postgres.host | quote }}
        - name: PGPORT
          value: {{ .Values.postgres.port | quote }}
        - name: PGDATABASE
          value: {{ .Values.postgres.database | quote }}
        - name: PGUSER
          value: {{ .Values.postgres.username | quote }}
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        # OpenTelemetry configuration
        - name: OTEL_SERVICE_NAME
          value: "api-stock"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_EXPERIMENT
          value: {{ .Values.otel.experiment | default "default" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
