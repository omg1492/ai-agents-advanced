{{- if .Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  annotations:
    {{- if .Values.gateway.loadBalancerIP }}
    service.beta.kubernetes.io/azure-load-balancer-ipv4: {{ .Values.gateway.loadBalancerIP | quote }}
    service.beta.kubernetes.io/azure-load-balancer-resource-group: {{ .Values.gateway.resourceGroup | quote }}
    {{- end }}
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
{{- end }}
