[project]
name = "acr-build-tools"
version = "0.1.0"
description = "Tools for building and pushing containers to Azure Container Registry"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include script files for script-only project
include = [
    "build_and_push.py",
    "config.yaml"
]

[tool.uv]
dev-dependencies = []
