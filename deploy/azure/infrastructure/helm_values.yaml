# Helm values for demo microservices
# This file is managed by Terraform and overrides chart defaults

# Default image pull policy
imagePullPolicy: Always

# Log level for all services
logLevel: INFO

# MCP configuration
# mcpApiKey: set via terraform set (sensitive, dynamically generated)
mcpCorsOrigins: "*"

# OpenAI configuration (for visualization generator)
openai:
  enabled: true
  # apiKey: set via terraform set (sensitive, from Azure Cognitive Services)
  model: gpt-5
  # baseUrl: set via terraform set (computed from Azure endpoint)
  apiVersion: preview
  reasoningEffort: low

# Gateway API configuration
gateway:
  enabled: true
  name: eg
  # loadBalancerIP: set via terraform set (from azurerm_public_ip)
  # resourceGroup: set via terraform set (node resource group)
  # fqdn: set via terraform set (from azurerm_public_ip)

# Replica configuration
replicaCount: 2

# Horizontal Pod Autoscaler configuration
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 64Mi

# Service configuration - add or remove services here
# All services use port 8000 (configured via PORT env variable)
# Set external: true to expose service via Gateway API
services:
  - name: api-stock
    image: api-stock
    tag: latest
    external: false
    
  - name: mcp-chef-services
    image: mcp-chef-services
    tag: latest
    external: true
    
  - name: mcp-public-farmer-tools
    image: mcp-public-farmer-tools
    tag: latest
    external: true
    
  - name: mcp-visualization-generator
    image: mcp-visualization-generator
    tag: latest
    external: true
