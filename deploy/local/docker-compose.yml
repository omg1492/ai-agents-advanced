version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aidb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin12345678
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d aidb"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
