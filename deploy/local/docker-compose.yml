services:
  postgres:
    image: ghcr.io/tkubica12/advanced-ai-applications/postgres:latest
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api-stock:
    image: ghcr.io/tkubica12/advanced-ai-applications/api-stock:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "8011:8011"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8011/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dreamfarm-agent:
    image: dreamfarm-agent
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      # Internal DNS name for PostgreSQL
      - PGHOST=postgres
      - PGPORT=${PGPORT}
      # Unified OpenAI configuration (works for OpenAI and Azure)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_VERSION=${OPENAI_API_VERSION}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Enable stock tool inside agent and point to internal service URL
      - STOCK_TOOL_ENABLED=true
      - STOCK_API_URL=http://api-stock:8011
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dreamfarm-frontend:
    image: dreamfarm-frontend
    profiles:
      - test
    depends_on:
      dreamfarm-agent:
        condition: service_healthy
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
      - REACT_APP_API_VERSION=v1
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
