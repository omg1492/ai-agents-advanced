name: Build and Publish Postgres (pgvector + AGE)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g., latest, v1, dev-<sha>)"
        required: true
        default: latest
      age_ref:
        description: "Apache AGE git ref (tag/branch/commit). Use a tagged release for stability."
        required: false
        default: "master"
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/postgres

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./postgresql
          file: ./postgresql/Dockerfile
          push: true
          build-args: |
            AGE_REF=${{ github.event.inputs.age_ref }}
          platforms: ${{ github.event.inputs.platforms }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
