[project]
name = "mcp-visualization-generator"
version = "0.1.0"
description = "MCP server for generating custom HTML visualizations"
authors = [
    {name = "Advanced AI Applications Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "openai>=1.101.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "html5lib>=1.1",
    # OpenTelemetry core
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # Auto-instrumentation for Starlette (FastMCP uses Starlette)
    "opentelemetry-distro>=0.41b0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-instrumentation-starlette>=0.41b0",
    # Dual OpenAI instrumentation (switch via OTEL_INSTRUMENTATION_PROVIDER env var)
    "openinference-instrumentation-openai>=0.1.34",  # OpenInference (streaming-compatible NOW)
    "opentelemetry-instrumentation-openai>=0.47.0",  # Standard OTel (Langfuse-compatible)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
mcp-visualization-generator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
