[project]
name = "chef-agent"
version = "0.1.0"
description = "Chef culinary services AI agent using remote Chef Services MCP"
authors = [
    {name = "Advanced AI Applications Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.101.0,<2.0.0",
    # OpenTelemetry core and exporters
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # OpenTelemetry auto-instrumentation libraries
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    # Dual OpenAI instrumentation providers (switch via env var)
    "openinference-instrumentation-openai>=0.1.34",
    "opentelemetry-instrumentation-openai>=0.47.3",
]

[project.scripts]
chef-agent = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]
