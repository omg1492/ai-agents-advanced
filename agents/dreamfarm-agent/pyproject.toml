[project]
name = "dreamfarm-agent"
version = "0.1.0"
description = "Dream Farm marketplace AI agent"
authors = [
    {name = "Advanced AI Applications Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    # Responses API + reasoning and async client support
    "openai>=1.101.0,<2.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.42",
    "pgvector>=0.4.1",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.8.0",
]

[project.scripts]
dreamfarm-agent = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]
