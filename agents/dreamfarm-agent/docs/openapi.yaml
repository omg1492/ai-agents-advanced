components:
  schemas:
    ChatRequest:
      description: "Request model for chat interaction.\n\nAttributes:\n    message:\
        \ The user's input message\n    previous_response_id: Optional previous response\
        \ ID to continue server-side state"
      properties:
        message:
          title: Message
          type: string
        previous_response_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Response Id
      required:
      - message
      title: ChatRequest
      type: object
    ChatResponse:
      description: "Response model for chat interaction.\n\nAttributes:\n    response_id:\
        \ The ID of the response created by the API\n    message: Assistant's generated\
        \ message\n    timestamp: ISO 8601 timestamp when the response was generated"
      properties:
        message:
          title: Message
          type: string
        response_id:
          title: Response Id
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - response_id
      - message
      - timestamp
      title: ChatResponse
      type: object
    CreateThreadRequest:
      description: Request to create a new thread/session.
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: CreateThreadRequest
      type: object
    CreateThreadResponse:
      description: Response with created thread info.
      properties:
        created_at:
          title: Created At
          type: string
        thread_id:
          title: Thread Id
          type: string
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - thread_id
      - title
      - created_at
      - updated_at
      title: CreateThreadResponse
      type: object
    GetMessagesResponse:
      description: Paginated message history for a thread.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          title: Messages
          type: array
        thread_id:
          title: Thread Id
          type: string
        total_count:
          title: Total Count
          type: integer
      required:
      - thread_id
      - messages
      - total_count
      title: GetMessagesResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: "Health check response model.\n\nAttributes:\n    status: Current\
        \ health status of the service\n    timestamp: ISO 8601 timestamp of the health\
        \ check"
      properties:
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - status
      - timestamp
      title: HealthResponse
      type: object
    Message:
      description: Minimal message for history listing.
      properties:
        content:
          title: Content
          type: string
        message_id:
          title: Message Id
          type: string
        role:
          title: Role
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - message_id
      - thread_id
      - role
      - content
      - timestamp
      title: Message
      type: object
    SendMessageRequest:
      description: Request to send a new user message.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SendMessageRequest
      type: object
    SendMessageResponse:
      description: Response containing the assistant reply.
      properties:
        assistant_response:
          title: Assistant Response
          type: string
        message_id:
          title: Message Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          title: Timestamp
          type: string
        user_message:
          title: User Message
          type: string
      required:
      - message_id
      - thread_id
      - user_message
      - assistant_response
      - timestamp
      title: SendMessageResponse
      type: object
    Thread:
      description: Thread metadata returned by GET /threads/{thread_id}.
      properties:
        created_at:
          title: Created At
          type: string
        message_count:
          title: Message Count
          type: integer
        thread_id:
          title: Thread Id
          type: string
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - thread_id
      - title
      - created_at
      - updated_at
      - message_count
      title: Thread
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: AI-powered assistant for Dream Farm marketplace
  title: DreamFarm Agent
  version: 0.1.0
openapi: 3.1.0
paths:
  /chat:
    post:
      description: 'Single endpoint chat using server-side conversation state.


        Uses Responses API with store=True and previous_response_id for continuity.'
      operationId: chat_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Chat
  /health:
    get:
      description: "Health check endpoint.\n\nReturns:\n    Health status and timestamp"
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health Check
  /threads:
    post:
      operationId: create_thread_threads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateThreadResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Thread
  /threads/{thread_id}:
    get:
      operationId: get_thread_threads__thread_id__get
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Thread
  /threads/{thread_id}/messages:
    get:
      operationId: get_messages_threads__thread_id__messages_get
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessagesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Messages
    post:
      operationId: send_message_threads__thread_id__messages_post
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Message
  /threads/{thread_id}/messages/stream:
    post:
      description: 'Stream assistant response tokens for a user message in a thread.


        Streams raw text chunks so the frontend can progressively render tokens.

        Also updates lightweight history and server-side state once completed.'
      operationId: send_message_stream_threads__thread_id__messages_stream_post
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Message Stream
