components:
  schemas:
    CreateThreadRequest:
      description: "Request model for creating a new thread.\n\nAttributes:\n    title:\
        \ Optional title for the thread"
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      title: CreateThreadRequest
      type: object
    CreateThreadResponse:
      description: "Response model for thread creation.\n\nAttributes:\n    thread_id:\
        \ Unique identifier for the created thread\n    title: Title of the created\
        \ thread\n    created_at: ISO 8601 timestamp when thread was created\n   \
        \ updated_at: ISO 8601 timestamp when thread was last updated"
      properties:
        created_at:
          title: Created At
          type: string
        thread_id:
          title: Thread Id
          type: string
        title:
          title: Title
          type: string
        updated_at:
          title: Updated At
          type: string
      required:
      - thread_id
      - title
      - created_at
      - updated_at
      title: CreateThreadResponse
      type: object
    GetMessagesResponse:
      description: "Response model for retrieving messages.\n\nAttributes:\n    thread_id:\
        \ ID of the thread\n    messages: List of messages in the thread\n    total_count:\
        \ Total number of messages in the thread"
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          title: Messages
          type: array
        thread_id:
          title: Thread Id
          type: string
        total_count:
          title: Total Count
          type: integer
      required:
      - thread_id
      - messages
      - total_count
      title: GetMessagesResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    HealthResponse:
      description: "Health check response model.\n\nAttributes:\n    status: Current\
        \ health status of the service\n    timestamp: ISO 8601 timestamp of the health\
        \ check"
      properties:
        status:
          title: Status
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - status
      - timestamp
      title: HealthResponse
      type: object
    Message:
      description: "Message model representing a single message in a conversation.\n\
        \nAttributes:\n    message_id: Unique identifier for the message\n    thread_id:\
        \ ID of the thread this message belongs to\n    role: Role of the message\
        \ sender (user or assistant)\n    content: Content of the message\n    timestamp:\
        \ ISO 8601 timestamp when message was created"
      properties:
        content:
          title: Content
          type: string
        message_id:
          title: Message Id
          type: string
        role:
          enum:
          - user
          - assistant
          title: Role
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - message_id
      - thread_id
      - role
      - content
      - timestamp
      title: Message
      type: object
    SendMessageRequest:
      description: "Request model for sending a message.\n\nAttributes:\n    message:\
        \ Content of the message to send"
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SendMessageRequest
      type: object
    SendMessageResponse:
      description: "Response model for sending a message.\n\nAttributes:\n    message_id:\
        \ Unique identifier for the user message\n    thread_id: ID of the thread\n\
        \    user_message: Content of the user's message\n    assistant_response:\
        \ Content of the assistant's response\n    timestamp: ISO 8601 timestamp when\
        \ the interaction occurred"
      properties:
        assistant_response:
          title: Assistant Response
          type: string
        message_id:
          title: Message Id
          type: string
        thread_id:
          title: Thread Id
          type: string
        timestamp:
          title: Timestamp
          type: string
        user_message:
          title: User Message
          type: string
      required:
      - message_id
      - thread_id
      - user_message
      - assistant_response
      - timestamp
      title: SendMessageResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: AI-powered assistant for Dream Farm marketplace
  title: DreamFarm Agent
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: "Health check endpoint.\n\nReturns:\n    Health status and timestamp"
      operationId: health_check_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health Check
  /threads:
    post:
      description: "Create a new conversation thread.\n\nArgs:\n    request: Thread\
        \ creation request with optional title\n    \nReturns:\n    Created thread\
        \ details"
      operationId: create_thread_threads_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateThreadResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Thread
  /threads/{thread_id}:
    get:
      description: "Get thread information by ID.\n\nArgs:\n    thread_id: ID of the\
        \ thread to retrieve\n    \nReturns:\n    Thread information\n    \nRaises:\n\
        \    HTTPException: If thread not found"
      operationId: get_thread_threads__thread_id__get
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Thread
  /threads/{thread_id}/messages:
    get:
      description: "Get conversation history for a thread.\n\nArgs:\n    thread_id:\
        \ ID of the thread\n    limit: Maximum number of messages to return (default:\
        \ 50)\n    offset: Number of messages to skip (default: 0)\n    \nReturns:\n\
        \    Messages and total count\n    \nRaises:\n    HTTPException: If thread\
        \ not found"
      operationId: get_messages_threads__thread_id__messages_get
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessagesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Messages
    post:
      description: "Send a message in a conversation thread.\n\nArgs:\n    thread_id:\
        \ ID of the thread\n    request: Message content to send\n    \nReturns:\n\
        \    Response containing user message and AI response\n    \nRaises:\n   \
        \ HTTPException: If thread not found or processing fails"
      operationId: send_message_threads__thread_id__messages_post
      parameters:
      - in: path
        name: thread_id
        required: true
        schema:
          title: Thread Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Send Message
